name: CI/CD - ShortRace Analytics

on:
  push:
    branches:
      - main
      - develop
      - "**"
  pull_request:
    branches:
      - main
      - develop

jobs:

  Lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CI Image
        run: docker build -t shortrace-ci -f .github/docker/dockerfile.ci .

      - name: Run Lint in Docker
        run: docker run --rm shortrace-ci npm run lint

  Check:
    name: ts Type Check
    runs-on: ubuntu-latest
    needs: Lint
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CI Image
        run: docker build -t shortrace-ci -f .github/docker/dockerfile.ci .

      - name: Run Type Check in Docker
        run: docker run --rm shortrace-ci npm run check

  Test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: Check
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CI Image
        run: docker build -t shortrace-ci -f .github/docker/dockerfile.ci .

      - name: Run Tests in Docker
        run: docker run --rm shortrace-ci npm run test:cov

  Deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: Test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CI Image
        run: docker build -t shortrace-ci -f .github/docker/dockerfile.ci .

      - name: Compile & Deploy in Docker
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SHORTRACE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SHORTRACE_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.SHORTRACE_AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.SHORTRACE_S3_BUCKET_NAME }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.SHORTRACE_CLOUDFRONT_DISTRIBUTION_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION \
            -e S3_BUCKET_NAME \
            -e CLOUDFRONT_DISTRIBUTION_ID \
            -e VITE_API_URL \
            shortrace-ci npm run deploy